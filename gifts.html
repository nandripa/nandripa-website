<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NANDRIPA Gifts</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f7;
text-align:center;
margin:0;
}

.hero{
padding:80px 20px;
}

h1{
font-size:70px;
}

p{
font-size:22px;
color:#555;
}

.gifts{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
padding:40px;
}

.card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="hero">
<h1>🎁 NANDRIPA Gifts</h1>

<p>
Premium gift collections for every occasion.
</p>
</div>

<div class="gifts">

<div class="card">
<h2>🎂 Birthday Gifts</h2>
</div>

<div class="card">
<h2>💍 Wedding Gifts</h2>
</div>

<div class="card">
<h2>👶 Baby Shower Gifts</h2>
</div>

<div class="card">
<h2>🎄 Christmas Gifts</h2>
</div>

<div class="card">
<h2>🌹 Customized Gifts</h2>
</div>

<div class="card">
<h2>🎉 Festival Gifts</h2>
</div>

</div>

</body>
</html>
